apply plugin: 'com.android.library'

group = 'org.owntube'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()

android {
  namespace "expo.modules.playersubtitles"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Provided at runtime by expo-video; keep in step with its media3 version.
  compileOnly "androidx.media3:media3-ui:1.4.0"
}
