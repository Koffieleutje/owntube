# Deploy on spiff, publishing owntube.nedworks.org.
#
# This uses the caddy-docker-proxy label style (as the home OwnTube compose
# does). Adjust the label PREFIX and the external network NAME to match spiff's
# actual Caddy setup — on a public host the cert is public (Let's Encrypt), so
# there's no `import tls_home`; Caddy provisions it automatically.
services:
  owntube-feeds-server:
    container_name: owntube-feeds-server
    hostname: owntube-feeds-server
    build:
      context: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATA_DIR: /data
      PUBLISH_SECRET: ${PUBLISH_SECRET:?set PUBLISH_SECRET in .env}
      # Feed Basic Auth is per user: credentials arrive with each publish
      # (username + SHA-256 of the RSS pass from OwnTube's user settings).
      # Optional /publish IP allow-list (defense-in-depth atop PUBLISH_SECRET).
      PUBLISH_ALLOW_HOSTS: ${PUBLISH_ALLOW_HOSTS:-}
      PUBLISH_ALLOW_IPS: ${PUBLISH_ALLOW_IPS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      # Deliberately still `companion-data`: this is a live named volume holding
      # the published snapshots and per-user feed credentials. Renaming it would
      # silently start from an empty one. `docker volume` can migrate it if the
      # old name ever becomes confusing enough to be worth the downtime.
      - companion-data:/data
    networks:
      - caddy
    labels:
      # caddy-docker-proxy (spiff): join the external `caddy` network, no authelia
      # import — the feeds server does its own HTTP Basic Auth (an auth portal
      # would break podcast-client credentials).
      caddy: "owntube.nedworks.org"
      caddy.reverse_proxy: "* {{upstreams 8080}}"

volumes:
  companion-data:

networks:
  caddy:
    external: true
