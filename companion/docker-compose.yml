# Deploy on spiff, publishing owntube.nedworks.org.
#
# This uses the caddy-docker-proxy label style (as the home OwnTube compose
# does). Adjust the label PREFIX and the external network NAME to match spiff's
# actual Caddy setup — on a public host the cert is public (Let's Encrypt), so
# there's no `import tls_home`; Caddy provisions it automatically.
services:
  owntube-companion:
    container_name: owntube-companion
    hostname: owntube-companion
    build:
      context: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATA_DIR: /data
      PUBLISH_SECRET: ${PUBLISH_SECRET:?set PUBLISH_SECRET in .env}
      RSS_USER: ${RSS_USER:?set RSS_USER in .env}
      RSS_PASS: ${RSS_PASS:?set RSS_PASS in .env}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - companion-data:/data
    networks:
      - caddy
    labels:
      # caddy-docker-proxy (spiff): join the external `caddy` network, no authelia
      # import — the companion does its own HTTP Basic Auth (an auth portal would
      # break podcast-client credentials).
      caddy: "owntube.nedworks.org"
      caddy.reverse_proxy: "* {{upstreams 8080}}"

volumes:
  companion-data:

networks:
  caddy:
    external: true
